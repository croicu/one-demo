[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "x__project_name__x"  # PEP 508 name must start/end alnum; see tasks/repo_setup.md
version = "0.1.0"
description = "__description__"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
]

[project.scripts]
__project_name__ = "__package_name__.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
